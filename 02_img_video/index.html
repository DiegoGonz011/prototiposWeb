<!DOCTYPE html>
<!--Declara el tipo de documento. Indica al navegador que usara HTML5-->
<html lang="es">
<!--Elemento principal del documento HTML.
lang="es" indica que el contenido esta en "español"-->

<head><!-- Seccion de configuracion del documento -->
    <meta charset="UTF-8">
    <!-- Define la codificacion de caracteres.
    UTF-8 permite usar correctamente tildes, ñ, simbolos, etc-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que el sitio sea responsive.
    Permite que el diseño se adapte correctamente a celulares y tablets-->
    <title>Practicando HTML - img y video</title>
    <!--Titulo que aparece en el navegador-->
    <meta name="author" content="Diego Gonzalez">
    <!--Indica quien creo el sitio web-->

    <link rel="stylesheet" href="static/css/style.css">
    <!--conexion con hoja CSS-->
</head>

<body>
    <header>
        <h1>Sitio multimedia personal</h1>
    </header>
    <hr> <!--crea una linea de division-->
    <main><!--seccion principal del documento-->
        <h2>Mis datos:</h2>
        <p>Nombre: Diego Gonzalez<br> <!--br es un salto de linea-->
            Curso: 3°C
        </p>
        <hr>
        <h2>Galeria multimedia</h2>
        <p>Imagen de ejemplo</p>
        <img src="static/images/Imagen1.png" alt="Primera imagen" width="300">
        <img src="static/images/imagen2.jpg" alt="Primera imagen" width="300">
        <img src="static/images/Imagen3.png" alt="Primera imagen" width="300">
        <hr>
        <h2>Videos</h2>
        <video width="500" controls> 
            <source src="static/video/Bad apple.mp4" type="Video/mp4">
        </video>
        <video width="500" height="400" controls> 
            <source src="static/video/Leon Backflips.mp4" type="Video/mp4">
        </video>
    </main>
    <footer>
        <p style="text-align: center;">Todos los derechos reservados
            -<a href="https://www.youtube.com/watch?v=E4WlUXrJgy4&feature=emb_err_woyt">Más informacion</a> <!--etiqueta <a> para vinculos-->
        </p>
    </footer>
</body>

</html>
